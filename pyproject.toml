[project]
name = "climate-alerts"
version = "0.1.0"
description = "Backend technical challenge for a climate alerts system."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14.1,<2.0.0",
  "asyncpg>=0.30.0,<1.0.0",
  "fastapi>=0.115.8,<1.0.0",
  "greenlet>=3.1.1,<4.0.0",
  "httpx>=0.28.1,<1.0.0",
  "psycopg[binary]>=3.2.6,<4.0.0",
  "pydantic-settings>=2.7.1,<3.0.0",
  "sqlalchemy>=2.0.37,<3.0.0",
  "uvicorn[standard]>=0.34.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.21.0,<1.0.0",
  "pytest>=8.3.4,<9.0.0",
  "pytest-asyncio>=0.25.3,<1.0.0",
]

[build-system]
requires = ["setuptools>=75.8.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
markers = [
  "concurrency: tests that exercise multi-worker claiming behavior",
  "migration: tests that validate migrated PostgreSQL schema state",
]
